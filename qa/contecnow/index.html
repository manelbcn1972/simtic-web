<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex,nofollow">
  <title>Contecnow Assistant QA</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#17202a}.app{min-height:100dvh;max-width:900px;margin:0 auto;background:#fff;display:grid;grid-template-rows:auto auto 1fr auto}.top{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-bottom:1px solid #e5e7eb}.brand strong{display:block;font-size:15px}.brand small{display:block;color:#6b7280;font-size:11px;margin-top:2px}.status{font-size:11px;color:#9a6700}.status.ok{color:#137a4f}.tabs{display:flex;border-bottom:1px solid #e5e7eb;padding:0 12px}.tabs button{border:0;background:transparent;padding:10px 12px;color:#667085;font-weight:600}.tabs button.active{color:#0f5f9a;border-bottom:2px solid #0f5f9a}.view{display:none;min-height:0;overflow:auto;padding:14px;background:#f8fafb}.view.active{display:block}.messages{display:flex;flex-direction:column;gap:9px}.msg{max-width:88%;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid #e3e7eb;line-height:1.4;font-size:14px}.msg.user{margin-left:auto;background:#0f5f9a;color:#fff;border-color:#0f5f9a}.card{background:#fff;border:1px solid #e1e6eb;border-radius:12px;padding:12px;margin-bottom:10px}.card h3{margin:0;font-size:14px}.card p{margin:6px 0 0;color:#697386;font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#fff0c8;color:#714900;font-size:10px;font-weight:700}.composerWrap{padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);border-top:1px solid #e5e7eb;background:#fff}.composer{display:flex;gap:8px;align-items:flex-end;background:#f8fafb;border:1px solid #d9dee5;border-radius:20px;padding:6px}.composer textarea{flex:1;resize:none;min-height:40px;max-height:130px;border:0;outline:0;background:transparent;padding:10px;font:inherit}.composer button,.refresh{border:0;background:#0f5f9a;color:#fff;border-radius:10px;padding:10px 12px;font-weight:600}.refresh{padding:7px 9px;font-size:11px}.cancelBtn{margin-left:auto;border:1px solid #e7b7b7;background:#fff;color:#a33;border-radius:8px;padding:6px 9px;font-size:11px;font-weight:700}.error{background:#fde8e8;color:#9b2c2c;border:1px solid #f2bcbc;padding:10px;border-radius:10px;margin-bottom:10px;font-size:12px}.hidden{display:none!important}.empty{color:#7a838e;font-size:12px}.connector{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #eef1f4}.connector:last-child{border-bottom:0}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#d99100;margin-right:6px}.dot.green{background:#16965f}@media(min-width:700px){.app{box-shadow:0 0 0 1px #e7e9ed}.view{padding:18px}.composerWrap{padding-left:18px;padding-right:18px}}
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><strong>Contecnow Assistant</strong><small>QA · Odoo + Outlook</small></div>
    <div id="status" class="status">Conectando…</div>
  </header>
  <nav class="tabs">
    <button class="active" data-view="chat">Chat</button>
    <button data-view="queue">Pendientes <span id="badge"></span></button>
    <button data-view="connectors">Conectores</button>
  </nav>
  <main>
    <section id="view-chat" class="view active"><div id="error" class="error hidden"></div><div id="messages" class="messages"></div></section>
    <section id="view-queue" class="view"><div class="row" style="justify-content:space-between;margin-bottom:10px"><strong>Pendientes</strong><button id="refresh" class="refresh">Actualizar</button></div><div id="queue"></div></section>
    <section id="view-connectors" class="view"><div id="connectors" class="card"></div></section>
  </main>
  <footer class="composerWrap">
    <form id="form" class="composer"><textarea id="input" rows="1" placeholder="Escribe lo que necesitas…"></textarea><button>Enviar</button></form>
  </footer>
</div>
<script>
const API='https://gzrcorvigobwbhjjrhku.supabase.co/functions/v1/contecnow-browser-api';
const CANCEL_API='https://gzrcorvigobwbhjjrhku.supabase.co/functions/v1/contecnow-cancel-action';
const KEY='contecnow.qa.session.v1';
let token=localStorage.getItem(KEY)||'';
const $=id=>document.getElementById(id);
function setStatus(text,ok=false){$('status').textContent=text;$('status').className='status'+(ok?' ok':'')}
function showError(text){$('error').textContent=text;$('error').classList.remove('hidden');setStatus('Error')}
function clearError(){$('error').classList.add('hidden')}
async function api(action,data={}){const headers={'content-type':'application/json'};if(token)headers.authorization='Bearer '+token;const r=await fetch(API,{method:'POST',headers,body:JSON.stringify({action,data})});const b=await r.json().catch(()=>({}));if(!r.ok||b.ok===false)throw new Error(b.error||('HTTP '+r.status));return b}
async function bootstrap(){const p=new URLSearchParams(location.hash.slice(1));const code=p.get('bootstrap');if(code){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'bootstrap.exchange',data:{code,role:'app'}})});const b=await r.json().catch(()=>({}));if(!r.ok||!b.ok)throw new Error(b.error||'No pude activar el acceso');token=b.token;localStorage.setItem(KEY,token);history.replaceState(null,'',location.pathname)}if(!token)throw new Error('Falta enlace de acceso')}
function renderMessages(items){const box=$('messages');box.innerHTML='';if(!items?.length){box.innerHTML='<div class="empty">No hay mensajes todavía.</div>';return}for(const m of items){const d=document.createElement('div');d.className='msg '+(m.role==='user'?'user':'');d.textContent=m.content;box.appendChild(d)}box.parentElement.scrollTop=box.parentElement.scrollHeight}
async function cancelAction(a){if(!confirm('¿Cancelar "'+a.title+'"?\n\nSe quitará de Pendientes y conservaré el historial. Si otras tareas dependen de ésta, también se cancelarán.'))return;clearError();setStatus('Cancelando…');try{const r=await fetch(CANCEL_API,{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+token},body:JSON.stringify({actionId:a.id,reason:'Cancelada por el usuario desde Contecnow Assistant QA'})});const b=await r.json().catch(()=>({}));if(!r.ok||!b.ok)throw new Error(b.error||('HTTP '+r.status));await load()}catch(e){showError(e.message)}}
function renderQueue(items){const box=$('queue');box.innerHTML='';const pending=(items||[]).filter(a=>!['HECHO','CANCELADA'].includes(a.status));$('badge').textContent=pending.length?'('+pending.length+')':'';if(!pending.length){box.innerHTML='<div class="empty">No hay tareas pendientes.</div>';return}for(const a of pending){const c=document.createElement('article');c.className='card';const top=document.createElement('div');top.className='row';const h=document.createElement('h3');h.textContent=a.title;const s=document.createElement('span');s.className='pill';s.textContent=a.status;const x=document.createElement('button');x.type='button';x.className='cancelBtn';x.textContent='Cancelar';x.onclick=()=>cancelAction(a);top.append(h,s,x);const p=document.createElement('p');p.textContent=a.last_error||a.action_type;c.append(top,p);box.appendChild(c)}}
function renderConnectors(c){const box=$('connectors');box.innerHTML='';const rows=[['Chrome/Work',!!c.chrome_work?.online,c.chrome_work?.online?'ONLINE':'Sin sesión'],['Make / Odoo',false,'Pendiente autorización'],['Outlook',false,'Disponible vía ChatGPT']];for(const [name,on,detail] of rows){const d=document.createElement('div');d.className='connector';const left=document.createElement('div');left.innerHTML='<span class="dot'+(on?' green':'')+'"></span><strong>'+name+'</strong>';const right=document.createElement('span');right.className='empty';right.textContent=detail;d.append(left,right);box.appendChild(d)}}
async function load(){clearError();const [m,q,c]=await Promise.all([api('messages.list'),api('queue.list'),api('connectors.get')]);renderMessages(m.messages||[]);renderQueue(q.actions||[]);renderConnectors(c);setStatus('QA online',true)}
$('form').addEventListener('submit',async e=>{e.preventDefault();const i=$('input'),text=i.value.trim();if(!text)return;i.value='';try{await api('queue.prepare',{text,requestId:crypto.randomUUID()});await load()}catch(err){showError(err.message)}});
$('input').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,130)+'px'});
$('refresh').onclick=()=>load().catch(e=>showError(e.message));
for(const b of document.querySelectorAll('.tabs button'))b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$('view-'+b.dataset.view).classList.add('active')};
(async()=>{try{await bootstrap();await load();setInterval(()=>load().catch(()=>{}),30000)}catch(e){showError(e.message)}})();
</script>
</body>
</html>
